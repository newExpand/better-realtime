name: Publish verified npm artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact approved package version
        required: true
        type: string
      source_sha:
        description: Exact immutable release/tag source commit SHA
        required: true
        type: string
      workflow_sha:
        description: Exact reviewed main commit containing the release workflow
        required: true
        type: string
      expected_sha256:
        description: Exact lowercase SHA-256 of the reviewed release artifact
        required: true
        type: string
      expected_size:
        description: Exact byte size of the reviewed release artifact
        required: true
        type: string

permissions:
  contents: read
  checks: read
  id-token: none

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      id-token: none
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      tag: ${{ steps.identity.outputs.tag }}
      sha256: ${{ steps.approved.outputs.sha256 }}
      size: ${{ steps.approved.outputs.size }}
    steps:
      - name: Bind the dispatch to the approved source and workflow revisions
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INPUT_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$RUN_REF" = refs/heads/main
          test "$RUN_SHA" = "$INPUT_WORKFLOW_SHA"
          test "$WORKFLOW_SHA" = "$INPUT_WORKFLOW_SHA"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: npm install --global npm@11.18.0
      - name: Resolve the approved package identity
        id: identity
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$INPUT_VERSION" =~ ^0\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          [[ "$INPUT_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INPUT_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$INPUT_WORKFLOW_SHA"
          git cat-file -e "$INPUT_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$INPUT_SOURCE_SHA" "$INPUT_WORKFLOW_SHA"
          test "$(git show "$INPUT_SOURCE_SHA:packages/runtime/package.json" | jq -r .version)" = "$INPUT_VERSION"
          echo "artifact_name=release-candidate-$INPUT_SOURCE_SHA-$INPUT_VERSION-attempt-$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm check
      - run: pnpm compatibility:check
      - run: pnpm test:postgres:docker
      - run: pnpm package:export-public
        env:
          BETTER_REALTIME_RELEASE_EXPORT: "1"
      - name: Materialize the immutable source release notes
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: git show "$INPUT_SOURCE_SHA:CHANGELOG.md" > approved-CHANGELOG.md
      - name: Check out the immutable package source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          persist-credentials: false
      - name: Install the immutable package source
        run: pnpm --dir release-source install --frozen-lockfile
      - run: pnpm --dir release-source audit --audit-level=high
      - name: Build the release artifact once
        id: artifact
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          artifact="better-realtime-$INPUT_VERSION.tgz"
          mkdir -p output
          pnpm --dir release-source --silent package:pack > output/package-report.json
          node -e "const fs=require('fs');const report=JSON.parse(fs.readFileSync('output/package-report.json','utf8'));if(report.version!==process.argv[1])throw new Error('RT_RELEASE_VERSION_MISMATCH');fs.copyFileSync(report.tarball,process.argv[2])" "$INPUT_VERSION" "$GITHUB_WORKSPACE/$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Verify the approved release artifact identity
        id: approved
        env:
          INPUT_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          INPUT_EXPECTED_SIZE: ${{ inputs.expected_size }}
        run: |
          set -euo pipefail
          artifact="${{ steps.artifact.outputs.artifact }}"
          expected_sha256="$INPUT_EXPECTED_SHA256"
          expected_size="$INPUT_EXPECTED_SIZE"
          [[ "$expected_sha256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$expected_size" =~ ^[1-9][0-9]*$ ]]
          test "$(sha256sum "$artifact" | cut -d' ' -f1)" = "$expected_sha256"
          test "$(wc -c < "$artifact" | tr -d ' ')" = "$expected_size"
          test "$(cat "$artifact.sha256")" = "$expected_sha256  $artifact"
          node -e "const fs=require('fs');const report=JSON.parse(fs.readFileSync('output/package-report.json','utf8'));const manifest=JSON.parse(fs.readFileSync('release/package-files.json','utf8'));if(report.size!==Number(process.argv[1]))throw new Error('RT_RELEASE_APPROVED_SIZE_MISMATCH');if(report.files!==manifest.files.length)throw new Error('RT_RELEASE_APPROVED_FILE_COUNT_MISMATCH')" "$expected_size"
          echo "sha256=$expected_sha256" >> "$GITHUB_OUTPUT"
          echo "size=$expected_size" >> "$GITHUB_OUTPUT"
      - name: Create the canonical release identity record
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_ARTIFACT: ${{ steps.artifact.outputs.artifact }}
          RELEASE_CHECKSUM: ${{ steps.artifact.outputs.artifact }}.sha256
          RELEASE_NOTES: approved-CHANGELOG.md
          RELEASE_IDENTITY_OUTPUT: release-identity.json
          RELEASE_EXPECTED_SHA256: ${{ steps.approved.outputs.sha256 }}
          RELEASE_EXPECTED_SIZE: ${{ steps.approved.outputs.size }}
        run: pnpm tsx scripts/create-release-identity.ts
      - name: Observe and fail closed on incompatible external state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IDENTITY_FILE: release-identity.json
        run: pnpm tsx scripts/release-state-machine-github.ts observe
      - name: Verify the exact release artifact in a clean room
        env:
          BETTER_REALTIME_TARBALL: ${{ github.workspace }}/${{ steps.artifact.outputs.artifact }}
        run: pnpm package:clean-room
      - name: Upload the reviewed release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: |
            ${{ steps.artifact.outputs.artifact }}
            ${{ steps.artifact.outputs.artifact }}.sha256
            release-identity.json
            approved-CHANGELOG.md
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          include-hidden-files: false

  stage-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      id-token: none
    outputs:
      release_id: ${{ steps.reconcile.outputs.release_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets
      - name: Reconcile tag, numeric Release ID, assets, and immutable finalization
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IDENTITY_FILE: release-assets/release-identity.json
          RELEASE_NOTES_FILE: release-assets/approved-CHANGELOG.md
          RELEASE_ASSET_DIR: release-assets
        run: pnpm tsx scripts/release-state-machine-github.ts reconcile-github
      - name: Verify GitHub release attestations
        env:
          TAG: ${{ needs.build.outputs.tag }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$TAG" "release-assets/$ARTIFACT" --repo "$GITHUB_REPOSITORY"

  prepare-publication:
    needs: [build, stage-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      id-token: none
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
      publish: ${{ steps.prepare.outputs.publish }}
      publish_run_id: ${{ steps.prepare.outputs.publish_run_id }}
      publish_run_attempt: ${{ steps.prepare.outputs.publish_run_attempt }}
      identity_digest: ${{ steps.prepare.outputs.identity_digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets
      - name: Plan publication without OIDC or external mutation
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IDENTITY_FILE: release-assets/release-identity.json
          EXPECTED_RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
        run: pnpm tsx scripts/release-state-machine-github.ts plan-publication

  publish:
    needs: [build, stage-release, prepare-publication]
    runs-on: ubuntu-latest
    environment: npm-alpha
    permissions:
      actions: read
      contents: read
      checks: write
      id-token: write
    outputs:
      release_id: ${{ steps.result.outputs.release_id }}
      publish_workflow_sha: ${{ steps.result.outputs.publish_workflow_sha }}
      publish_run_id: ${{ steps.result.outputs.publish_run_id }}
      publish_run_attempt: ${{ steps.result.outputs.publish_run_attempt }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets
      - name: Validate the approved identity without repository code
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
          EXPECTED_ARTIFACT: ${{ needs.build.outputs.artifact }}
          EXPECTED_IDENTITY_DIGEST: ${{ needs.prepare-publication.outputs.identity_digest }}
        run: |
          set -euo pipefail
          identity=release-assets/release-identity.json
          artifact="release-assets/$EXPECTED_ARTIFACT"
          test "$(node --version)" = v24.18.0
          test "$(npm --version)" = 11.16.0
          [[ "$EXPECTED_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_IDENTITY_DIGEST" =~ ^br-release-v1-[a-f0-9]{64}$ ]]
          test "$(jq -r .repository "$identity")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .version "$identity")" = "$INPUT_VERSION"
          test "$(jq -r .sourceSha "$identity")" = "$INPUT_SOURCE_SHA"
          test "$(jq -r .tag "$identity")" = "v$INPUT_VERSION"
          test "$(jq -r .artifact.name "$identity")" = "$EXPECTED_ARTIFACT"
          test "$(jq -r .artifact.sha256 "$identity")" = "$EXPECTED_SHA256"
          test "$(jq -r .artifact.size "$identity")" = "$EXPECTED_SIZE"
          canonical_digest="$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const i=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const releaseId=Number(process.argv[2]);if(!Number.isSafeInteger(releaseId)||releaseId<=0)throw new Error("invalid release ID");const value=JSON.stringify([i.repository,i.version,i.sourceSha,i.tag,i.tagMessage,i.title,i.bodySha256,i.artifact.name,i.artifact.sha256,i.artifact.size,i.checksum.name,i.checksum.sha256,i.checksum.size,i.packageFiles,releaseId]);process.stdout.write(`br-release-v1-${crypto.createHash("sha256").update(value).digest("hex")}`)' "$identity" "$EXPECTED_RELEASE_ID")"
          test "$canonical_digest" = "$EXPECTED_IDENTITY_DIGEST"
          test "$(sha256sum "$artifact" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          test "$(wc -c < "$artifact" | tr -d ' ')" = "$EXPECTED_SIZE"
          test "$(cat "$artifact.sha256")" = "$EXPECTED_SHA256  $EXPECTED_ARTIFACT"
          release_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID")"
          test "$(jq -r .id <<<"$release_json")" = "$EXPECTED_RELEASE_ID"
          test "$(jq -r .tag_name <<<"$release_json")" = "v$INPUT_VERSION"
          test "$(jq -r .target_commitish <<<"$release_json")" = "$INPUT_SOURCE_SHA"
          test "$(jq -r .draft <<<"$release_json")" = false
          test "$(jq -r .prerelease <<<"$release_json")" = true
          test "$(jq -r .immutable <<<"$release_json")" = true
          test "$(jq -r .name <<<"$release_json")" = "$(jq -r .title "$identity")"
          printf '%s' "$release_json" > release.json
          release_body_sha="$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const release=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(crypto.createHash("sha256").update(release.body??"").digest("hex"))' release.json)"
          test "$release_body_sha" = "$(jq -r .bodySha256 "$identity")"
          tag_ref="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/v$INPUT_VERSION")"
          test "$(jq -r .object.type <<<"$tag_ref")" = tag
          tag_object_sha="$(jq -r .object.sha <<<"$tag_ref")"
          [[ "$tag_object_sha" =~ ^[a-f0-9]{40}$ ]]
          tag_object="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
          test "$(jq -r .tag <<<"$tag_object")" = "v$INPUT_VERSION"
          test "$(jq -r .message <<<"$tag_object")" = "$(jq -r .tagMessage "$identity")"
          test "$(jq -r .object.type <<<"$tag_object")" = commit
          test "$(jq -r .object.sha <<<"$tag_object")" = "$INPUT_SOURCE_SHA"
          : > release-assets.jsonl
          for page in $(seq 1 100); do
            assets_json="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID/assets?per_page=100&page=$page")"
            jq -c '.[]' <<<"$assets_json" >> release-assets.jsonl
            test "$(jq -r length <<<"$assets_json")" -le 100
            if [ "$(jq -r length <<<"$assets_json")" -lt 100 ]; then break; fi
            test "$page" -lt 100
          done
          test "$(wc -l < release-assets.jsonl | tr -d ' ')" = 2
          checksum_name="$(jq -r .checksum.name "$identity")"
          checksum_sha="$(jq -r .checksum.sha256 "$identity")"
          checksum_size="$(jq -r .checksum.size "$identity")"
          artifact_record="$(jq -sc --arg name "$EXPECTED_ARTIFACT" '[.[] | select(.name == $name)] | if length == 1 then .[0] else error("artifact identity") end' release-assets.jsonl)"
          checksum_record="$(jq -sc --arg name "$checksum_name" '[.[] | select(.name == $name)] | if length == 1 then .[0] else error("checksum identity") end' release-assets.jsonl)"
          test "$(jq -r .state <<<"$artifact_record")" = uploaded
          test "$(jq -r .digest <<<"$artifact_record")" = "sha256:$EXPECTED_SHA256"
          test "$(jq -r .size <<<"$artifact_record")" = "$EXPECTED_SIZE"
          test "$(jq -r .state <<<"$checksum_record")" = uploaded
          test "$(jq -r .digest <<<"$checksum_record")" = "sha256:$checksum_sha"
          test "$(jq -r .size <<<"$checksum_record")" = "$checksum_size"
          artifact_id="$(jq -r .id <<<"$artifact_record")"
          checksum_id="$(jq -r .id <<<"$checksum_record")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$checksum_id" =~ ^[1-9][0-9]*$ ]]
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$artifact_id" > remote-artifact.tgz
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$checksum_id" > remote-artifact.tgz.sha256
          cmp "$artifact" remote-artifact.tgz
          cmp "$artifact.sha256" remote-artifact.tgz.sha256
      - name: Re-observe publication state at the OIDC boundary
        id: reobserve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARED_PUBLISH: ${{ needs.prepare-publication.outputs.publish }}
          EXPECTED_IDENTITY_DIGEST: ${{ needs.prepare-publication.outputs.identity_digest }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          prefix="publish-intent/$INPUT_VERSION/"
          : > publish-intents.jsonl
          for page in $(seq 1 100); do
            response="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/commits/$INPUT_SOURCE_SHA/check-runs?filter=all&per_page=100&page=$page")"
            jq -c --arg prefix "$prefix" '.check_runs[] | select(.name | startswith($prefix))' <<<"$response" >> publish-intents.jsonl
            test "$(jq -r '.check_runs | length' <<<"$response")" -le 100
            if [ "$(jq -r '.check_runs | length' <<<"$response")" -lt 100 ]; then break; fi
            test "$page" -lt 100
          done
          intent_count="$(wc -l < publish-intents.jsonl | tr -d ' ')"
          test "$intent_count" -le 1
          registry_status="$(curl --silent --show-error --output registry-state.json --write-out '%{http_code}' "https://registry.npmjs.org/better-realtime/$INPUT_VERSION")"
          if [ "$registry_status" = 404 ]; then
            test "$intent_count" = 0
            test "$PREPARED_PUBLISH" = true
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "publish_workflow_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "publish_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "publish_run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          elif [ "$registry_status" = 200 ]; then
            test "$intent_count" = 1
            marker="$(cat publish-intents.jsonl)"
            test "$(jq -r .head_sha <<<"$marker")" = "$INPUT_SOURCE_SHA"
            test "$(jq -r .external_id <<<"$marker")" = "$EXPECTED_IDENTITY_DIGEST"
            marker_name="$(jq -r .name <<<"$marker")"
            marker_suffix="${marker_name#"$prefix"}"
            [[ "$marker_suffix" =~ ^([1-9][0-9]*)/([1-9][0-9]*)$ ]]
            original_publish_run_id="${BASH_REMATCH[1]}"
            original_publish_run_attempt="${BASH_REMATCH[2]}"
            publish_run="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$original_publish_run_id/attempts/$original_publish_run_attempt")"
            test "$(jq -r .id <<<"$publish_run")" = "$original_publish_run_id"
            test "$(jq -r .run_attempt <<<"$publish_run")" = "$original_publish_run_attempt"
            test "$(jq -r .event <<<"$publish_run")" = workflow_dispatch
            test "$(jq -r .path <<<"$publish_run")" = .github/workflows/release.yml
            original_publish_workflow_sha="$(jq -r .head_sha <<<"$publish_run")"
            [[ "$original_publish_workflow_sha" =~ ^[a-f0-9]{40}$ ]]
            tarball_url="$(jq -r .dist.tarball registry-state.json)"
            [[ "$tarball_url" == https://registry.npmjs.org/better-realtime/-/* ]]
            curl --fail --silent --show-error --location "$tarball_url" --output registry-artifact.tgz
            test "$(sha256sum registry-artifact.tgz | cut -d' ' -f1)" = "$EXPECTED_SHA256"
            test "$(wc -c < registry-artifact.tgz | tr -d ' ')" = "$EXPECTED_SIZE"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "publish_workflow_sha=$original_publish_workflow_sha" >> "$GITHUB_OUTPUT"
            echo "publish_run_id=$original_publish_run_id" >> "$GITHUB_OUTPUT"
            echo "publish_run_attempt=$original_publish_run_attempt" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected registry status: $registry_status" >&2
            exit 1
          fi
      - name: Record durable publish intent at the OIDC boundary
        if: steps.reobserve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
          EXPECTED_IDENTITY_DIGEST: ${{ needs.prepare-publication.outputs.identity_digest }}
        run: |
          set -euo pipefail
          name="publish-intent/$INPUT_VERSION/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          details_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          payload="$(jq -n \
            --arg name "$name" \
            --arg head_sha "$INPUT_SOURCE_SHA" \
            --arg external_id "$EXPECTED_IDENTITY_DIGEST" \
            --arg details_url "$details_url" \
            --arg title "publication intent recorded" \
            --arg summary "Release ID $EXPECTED_RELEASE_ID; identity $EXPECTED_IDENTITY_DIGEST" \
            '{name:$name,head_sha:$head_sha,status:"completed",conclusion:"neutral",external_id:$external_id,details_url:$details_url,output:{title:$title,summary:$summary}}')"
          response="$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/check-runs" \
            --input - <<<"$payload")"
          [[ "$(jq -r .id <<<"$response")" =~ ^[1-9][0-9]*$ ]]
          test "$(jq -r .name <<<"$response")" = "$name"
          test "$(jq -r .head_sha <<<"$response")" = "$INPUT_SOURCE_SHA"
          test "$(jq -r .external_id <<<"$response")" = "$EXPECTED_IDENTITY_DIGEST"
      - name: publish_once through npm Trusted Publishing
        if: steps.reobserve.outputs.publish == 'true'
        env:
          ARTIFACT: release-assets/${{ needs.build.outputs.artifact }}
        run: |
          set -euo pipefail
          npm publish "$ARTIFACT" --tag alpha --access public --provenance --ignore-scripts
      - name: Export the publication identity for verification
        id: result
        env:
          RELEASE_ID: ${{ needs.prepare-publication.outputs.release_id }}
          PUBLISH_WORKFLOW_SHA: ${{ steps.reobserve.outputs.publish_workflow_sha }}
          PUBLISH_RUN_ID: ${{ steps.reobserve.outputs.publish_run_id }}
          PUBLISH_RUN_ATTEMPT: ${{ steps.reobserve.outputs.publish_run_attempt }}
        run: |
          set -euo pipefail
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "publish_workflow_sha=$PUBLISH_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "publish_run_id=$PUBLISH_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "publish_run_attempt=$PUBLISH_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  verify:
    needs: [build, stage-release, prepare-publication, publish]
    permissions:
      actions: read
      contents: read
      id-token: none
    uses: ./.github/workflows/release-verify.yml
    with:
      version: ${{ inputs.version }}
      tag: ${{ needs.build.outputs.tag }}
      release_id: ${{ needs.stage-release.outputs.release_id }}
      expected_sha256: ${{ needs.build.outputs.sha256 }}
      expected_size: ${{ needs.build.outputs.size }}
      source_sha: ${{ inputs.source_sha }}
      workflow_sha: ${{ inputs.workflow_sha }}
      publish_workflow_sha: ${{ needs.publish.outputs.publish_workflow_sha }}
      publish_run_id: ${{ needs.publish.outputs.publish_run_id }}
      publish_run_attempt: ${{ needs.publish.outputs.publish_run_attempt }}
