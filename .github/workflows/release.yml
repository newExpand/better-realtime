name: Release verified npm artifact

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-alpha
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v0.1.0-alpha.1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: npm install --global npm@11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:postgres:docker
      - run: pnpm package:export-public
        env:
          BETTER_REALTIME_RELEASE_EXPORT: "1"
      - name: Build the release artifact once
        run: |
          mkdir -p output
          pnpm --silent package:pack > output/package-report.json
          node -e "const fs=require('fs');const report=JSON.parse(fs.readFileSync('output/package-report.json','utf8'));fs.copyFileSync(report.tarball,'better-realtime-0.1.0-alpha.1.tgz')"
          sha256sum better-realtime-0.1.0-alpha.1.tgz > better-realtime-0.1.0-alpha.1.tgz.sha256
      - name: Verify the exact release artifact in a clean room
        run: pnpm package:clean-room
        env:
          BETTER_REALTIME_TARBALL: ${{ github.workspace }}/better-realtime-0.1.0-alpha.1.tgz
      - name: Create the draft prerelease with verified immutable assets
        run: gh release create v0.1.0-alpha.1 better-realtime-0.1.0-alpha.1.tgz better-realtime-0.1.0-alpha.1.tgz.sha256 --verify-tag --draft --prerelease --title "Better Realtime 0.1.0-alpha.1" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the asset-complete prerelease
        run: gh release edit v0.1.0-alpha.1 --draft=false --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Bootstrap-publish without moving alpha
        run: npm publish better-realtime-0.1.0-alpha.1.tgz --tag alpha-candidate --access public --provenance
        env:
          # Bootstrap GAT authority: packages-all read-write, organizations no-access, bypass-2FA enabled; not package- or version-scoped.
          # The npm-alpha Environment requires manual approval. Revoke this shortest-expiry credential immediately after publish and dist-tag completion.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ALPHA1_BOOTSTRAP_GAT }}
      - name: Verify registry bytes, install, and provenance signatures
        run: |
          mkdir -p registry-verification/signatures
          npm pack better-realtime@0.1.0-alpha.1 --pack-destination registry-verification
          cmp better-realtime-0.1.0-alpha.1.tgz registry-verification/better-realtime-0.1.0-alpha.1.tgz
          BETTER_REALTIME_TARBALL="${{ github.workspace }}/registry-verification/better-realtime-0.1.0-alpha.1.tgz" pnpm package:clean-room
          cd registry-verification/signatures
          npm init --yes
          npm install --ignore-scripts better-realtime@0.1.0-alpha.1
          npm audit signatures
      - name: Promote the verified version to alpha
        run: |
          npm dist-tag add better-realtime@0.1.0-alpha.1 alpha
          npm dist-tag rm better-realtime alpha-candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ALPHA1_BOOTSTRAP_GAT }}
