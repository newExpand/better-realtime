name: Verify published npm artifact

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      release_id:
        required: true
        type: string
      expected_sha256:
        required: true
        type: string
      expected_size:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      workflow_sha:
        required: true
        type: string
      identity_workflow_sha:
        required: true
        type: string
      publish_workflow_sha:
        required: true
        type: string
      publish_run_id:
        required: true
        type: string
      publish_run_attempt:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact already-published package version
        required: true
        type: string
      tag:
        description: Exact immutable public Git tag
        required: true
        type: string
      release_id:
        description: Exact numeric immutable GitHub Release ID
        required: true
        type: string
      expected_sha256:
        description: Expected lowercase SHA-256 from the reviewed artifact
        required: true
        type: string
      expected_size:
        description: Expected byte size from the reviewed artifact
        required: true
        type: string
      source_sha:
        description: Exact 40-character immutable release/tag source commit
        required: true
        type: string
      workflow_sha:
        description: Exact reviewed commit containing this verification workflow
        required: true
        type: string
      identity_workflow_sha:
        description: Exact workflow commit recorded by the immutable public identity asset
        required: true
        type: string
      publish_workflow_sha:
        description: Exact workflow commit recorded by the original publication provenance
        required: true
        type: string
      publish_run_id:
        description: Original release workflow run ID that performed package publication
        required: true
        type: string
      publish_run_attempt:
        description: Original release workflow run attempt that performed package publication
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: none

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Bind verification to the reviewed workflow revision
        env:
          INPUT_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$INPUT_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$RUN_REF" = refs/heads/main
          test "$RUN_SHA" = "$INPUT_WORKFLOW_SHA"
          test "$WORKFLOW_SHA" = "$INPUT_WORKFLOW_SHA"
      - name: Validate remote identity and immutable assets before repository code
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_IDENTITY_WORKFLOW_SHA: ${{ inputs.identity_workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          POST_PUBLISH_ROOT: ${{ runner.temp }}/better-realtime-post-publish
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          tag="$INPUT_TAG"
          release_id="$INPUT_RELEASE_ID"
          expected_sha256="$EXPECTED_SHA256"
          expected_size="$EXPECTED_SIZE"
          source_sha="$INPUT_SOURCE_SHA"
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          test "$tag" = "v$version"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$expected_sha256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$expected_size" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INPUT_IDENTITY_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id")"
          test "$(jq -r .id <<<"$release_json")" = "$release_id"
          test "$(jq -r .tag_name <<<"$release_json")" = "$tag"
          test "$(jq -r .name <<<"$release_json")" = "Better Realtime $version"
          test "$(jq -r .target_commitish <<<"$release_json")" = "$source_sha"
          test "$(jq -r .draft <<<"$release_json")" = false
          test "$(jq -r .prerelease <<<"$release_json")" = true
          test "$(jq -r .immutable <<<"$release_json")" = true
          mkdir -p "$POST_PUBLISH_ROOT/identity" "$POST_PUBLISH_ROOT/release" "$POST_PUBLISH_ROOT/registry" "$POST_PUBLISH_ROOT/signatures"
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag")"
          test "$(jq -r .object.type <<<"$tag_ref")" = tag
          tag_object_sha="$(jq -r .object.sha <<<"$tag_ref")"
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_object_sha")"
          test "$(jq -r .tag <<<"$tag_object")" = "$tag"
          test "$(jq -r .message <<<"$tag_object")" = "Better Realtime ${tag#v}"
          test "$(jq -r .object.type <<<"$tag_object")" = commit
          test "$(jq -r .object.sha <<<"$tag_object")" = "$source_sha"
          printf '%s\n' "$tag_object_sha" > "$POST_PUBLISH_ROOT/identity/tag-object-sha"
          asset="better-realtime-$version.tgz"
          public_identity="better-realtime-$version.identity.json"
          asset_names="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          expected_names="$(printf '%s\n%s\n%s\n' "$asset" "$asset.sha256" "$public_identity" | sort)"
          test "$asset_names" = "$expected_names"
          asset_json="$(jq -c --arg name "$asset" '[.assets[] | select(.name == $name)]' <<<"$release_json")"
          test "$(jq 'length' <<<"$asset_json")" = 1
          test "$(jq -r '.[0].digest' <<<"$asset_json")" = "sha256:$expected_sha256"
          test "$(jq -r '.[0].size' <<<"$asset_json")" = "$expected_size"
          printf '%s\n' "$release_json" > "$POST_PUBLISH_ROOT/identity/release.json"
          asset_id="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .id' <<<"$release_json")"
          checksum_id="$(jq -r --arg name "$asset.sha256" '.assets[] | select(.name == $name) | .id' <<<"$release_json")"
          identity_id="$(jq -r --arg name "$public_identity" '.assets[] | select(.name == $name) | .id' <<<"$release_json")"
          [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$checksum_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$identity_id" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id" > "$POST_PUBLISH_ROOT/release/$asset"
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/$checksum_id" > "$POST_PUBLISH_ROOT/release/$asset.sha256"
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/$identity_id" > "$POST_PUBLISH_ROOT/release/$public_identity"
          test "$(find "$POST_PUBLISH_ROOT/release" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test "$(sha256sum "$POST_PUBLISH_ROOT/release/$asset" | cut -d' ' -f1)" = "$expected_sha256"
          test "$(wc -c < "$POST_PUBLISH_ROOT/release/$asset" | tr -d ' ')" = "$expected_size"
          printf '%s  %s\n' "$expected_sha256" "$asset" > "$POST_PUBLISH_ROOT/identity/approved.sha256"
          cmp "$POST_PUBLISH_ROOT/identity/approved.sha256" "$POST_PUBLISH_ROOT/release/$asset.sha256"
          checksum_json="$(jq -c --arg name "$asset.sha256" '[.assets[] | select(.name == $name)]' <<<"$release_json")"
          test "$(jq 'length' <<<"$checksum_json")" = 1
          test "$(jq -r '.[0].digest' <<<"$checksum_json")" = "sha256:$(sha256sum "$POST_PUBLISH_ROOT/release/$asset.sha256" | cut -d' ' -f1)"
          test "$(jq -r '.[0].size' <<<"$checksum_json")" = "$(wc -c < "$POST_PUBLISH_ROOT/release/$asset.sha256" | tr -d ' ')"
          identity_workflow_commit="$(jq -r .workflow.commit "$POST_PUBLISH_ROOT/release/$public_identity")"
          identity_workflow_run="$(jq -r .workflow.runId "$POST_PUBLISH_ROOT/release/$public_identity")"
          identity_workflow_attempt="$(jq -r .workflow.runAttempt "$POST_PUBLISH_ROOT/release/$public_identity")"
          test "$identity_workflow_commit" = "$INPUT_IDENTITY_WORKFLOW_SHA"
          [[ "$identity_workflow_run" =~ ^[1-9][0-9]*$ ]]
          [[ "$identity_workflow_attempt" =~ ^[1-9][0-9]*$ ]]
          identity_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$identity_workflow_run/attempts/$identity_workflow_attempt")"
          test "$(jq -r .id <<<"$identity_run")" = "$identity_workflow_run"
          test "$(jq -r .run_attempt <<<"$identity_run")" = "$identity_workflow_attempt"
          test "$(jq -r .event <<<"$identity_run")" = workflow_dispatch
          test "$(jq -r .path <<<"$identity_run")" = .github/workflows/release.yml
          test "$(jq -r .head_sha <<<"$identity_run")" = "$identity_workflow_commit"
          test "$(jq -r .head_branch <<<"$identity_run")" = main
          gh attestation verify "$POST_PUBLISH_ROOT/release/$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --signer-digest "$INPUT_IDENTITY_WORKFLOW_SHA" \
            --source-ref refs/heads/main \
            --source-digest "$INPUT_IDENTITY_WORKFLOW_SHA"
          gh attestation verify "$POST_PUBLISH_ROOT/release/$public_identity" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --signer-digest "$INPUT_IDENTITY_WORKFLOW_SHA" \
            --source-ref refs/heads/main \
            --source-digest "$INPUT_IDENTITY_WORKFLOW_SHA"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release source from the approved workflow revision
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          POST_PUBLISH_ROOT: ${{ runner.temp }}/better-realtime-post-publish
        run: |
          set -euo pipefail
          [[ "$INPUT_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INPUT_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INPUT_WORKFLOW_SHA"
          git cat-file -e "$INPUT_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$INPUT_SOURCE_SHA" "$INPUT_WORKFLOW_SHA"
          test "$(git show "$INPUT_SOURCE_SHA:packages/runtime/package.json" | jq -r .version)" = "$INPUT_VERSION"
          git show "$INPUT_SOURCE_SHA:CHANGELOG.md" > "$POST_PUBLISH_ROOT/identity/source-changelog.md"
          test "$(jq -r .body "$POST_PUBLISH_ROOT/identity/release.json")" = "$(cat "$POST_PUBLISH_ROOT/identity/source-changelog.md")"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: npm install --global npm@11.18.0
      - run: pnpm install --frozen-lockfile
      - name: Recheck approved immutable assets without publication authority
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
          POST_PUBLISH_ROOT: ${{ runner.temp }}/better-realtime-post-publish
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          expected_sha256="$EXPECTED_SHA256"
          expected_size="$EXPECTED_SIZE"
          asset="better-realtime-$version.tgz"
          test "$(sha256sum "$POST_PUBLISH_ROOT/release/$asset" | cut -d' ' -f1)" = "$expected_sha256"
          test "$(wc -c < "$POST_PUBLISH_ROOT/release/$asset" | tr -d ' ')" = "$expected_size"
          cmp "$POST_PUBLISH_ROOT/identity/approved.sha256" "$POST_PUBLISH_ROOT/release/$asset.sha256"
      - name: Wait for bounded npm registry convergence
        env:
          INPUT_VERSION: ${{ inputs.version }}
          POST_PUBLISH_ROOT: ${{ runner.temp }}/better-realtime-post-publish
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          registry_artifact="$POST_PUBLISH_ROOT/registry/better-realtime-$version.tgz"
          for attempt in $(seq 1 20); do
            if npm pack "better-realtime@$version" --pack-destination "$POST_PUBLISH_ROOT/registry" >/dev/null 2>&1; then
              test -f "$registry_artifact"
              exit 0
            fi
            if [[ "$attempt" -eq 20 ]]; then
              echo "npm registry did not converge within 300 seconds" >&2
              exit 1
            fi
            sleep 15
          done
      - name: Compare registry bytes and run clean-room verification
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
          POST_PUBLISH_ROOT: ${{ runner.temp }}/better-realtime-post-publish
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          asset="$POST_PUBLISH_ROOT/release/better-realtime-$version.tgz"
          registry_artifact="$POST_PUBLISH_ROOT/registry/better-realtime-$version.tgz"
          test "$(sha256sum "$asset" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          test "$(wc -c < "$asset" | tr -d ' ')" = "$EXPECTED_SIZE"
          test "$(sha256sum "$registry_artifact" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          test "$(wc -c < "$registry_artifact" | tr -d ' ')" = "$EXPECTED_SIZE"
          cmp "$asset" "$registry_artifact"
          pnpm release:identity:verify -- \
            --identity "$POST_PUBLISH_ROOT/release/better-realtime-$version.identity.json" \
            --github-asset "$asset" \
            --npm-tarball "$registry_artifact" \
            --source-commit "$INPUT_SOURCE_SHA" \
            --tag-object "$(cat "$POST_PUBLISH_ROOT/identity/tag-object-sha")" \
            --workflow-commit "$(jq -r .workflow.commit "$POST_PUBLISH_ROOT/release/better-realtime-$version.identity.json")" \
            --workflow-run-id "$(jq -r .workflow.runId "$POST_PUBLISH_ROOT/release/better-realtime-$version.identity.json")" \
            --workflow-run-attempt "$(jq -r .workflow.runAttempt "$POST_PUBLISH_ROOT/release/better-realtime-$version.identity.json")" \
            --release-id "$INPUT_RELEASE_ID"
          expected_latest="$(jq -r .npmRegistry.distTags.latest "$POST_PUBLISH_ROOT/release/better-realtime-$version.identity.json")"
          test "$(npm view better-realtime dist-tags.latest)" = "$expected_latest"
          BETTER_REALTIME_TARBALL="$registry_artifact" pnpm package:clean-room
      - name: Verify registry signatures, provenance, and dist-tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_WORKFLOW_SHA: ${{ inputs.publish_workflow_sha }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          PUBLISH_RUN_ATTEMPT: ${{ inputs.publish_run_attempt }}
          GH_TOKEN: ${{ github.token }}
          POST_PUBLISH_ROOT: ${{ runner.temp }}/better-realtime-post-publish
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          [[ "$INPUT_PUBLISH_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PUBLISH_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PUBLISH_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          publish_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$PUBLISH_RUN_ID/attempts/$PUBLISH_RUN_ATTEMPT")"
          test "$(jq -r .id <<<"$publish_run")" = "$PUBLISH_RUN_ID"
          test "$(jq -r .run_attempt <<<"$publish_run")" = "$PUBLISH_RUN_ATTEMPT"
          test "$(jq -r .event <<<"$publish_run")" = workflow_dispatch
          test "$(jq -r .path <<<"$publish_run")" = .github/workflows/release.yml
          test "$(jq -r .head_sha <<<"$publish_run")" = "$INPUT_PUBLISH_WORKFLOW_SHA"
          audit_output="$POST_PUBLISH_ROOT/signatures/audit-signatures.json"
          (cd "$POST_PUBLISH_ROOT/signatures" && npm init --yes >/dev/null && npm install --ignore-scripts "better-realtime@$version" && npm audit signatures --json --include-attestations > "$audit_output")
          pnpm tsx scripts/verify-npm-provenance.ts \
            --audit-signatures "$audit_output" \
            --tarball "$POST_PUBLISH_ROOT/registry/better-realtime-$version.tgz" \
            --version "$version" \
            --workflow-sha "$INPUT_PUBLISH_WORKFLOW_SHA" \
            --publish-run-id "$PUBLISH_RUN_ID" \
            --publish-run-attempt "$PUBLISH_RUN_ATTEMPT"
          test "$(npm view better-realtime dist-tags.alpha)" = "$version"
