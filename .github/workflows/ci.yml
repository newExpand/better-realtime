name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify the approved public tree
        if: github.repository == 'newExpand/better-realtime'
        run: pnpm release:verify-public-tree
      - run: pnpm check
      - run: pnpm compatibility:check
      - run: pnpm package:clean-room
      - run: pnpm package:clean-room:isolation
      - run: pnpm package:export-public
      - run: pnpm audit --audit-level=high

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:postgres:docker
      - run: pnpm compatibility:matrix
      - name: Run browser E2E matrix
        id: browser-e2e
        run: pnpm e2e
      # Media is retained only for trusted main pushes. This job has no
      # repository secrets or OIDC permission, and checkout does not persist
      # the read token. Textual trace/error evidence is redacted separately.
      - name: Prepare bounded browser failure evidence
        id: prepare_browser_evidence
        if: failure() && steps.browser-e2e.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm e2e:prepare-failure-evidence
      - name: Preserve failed browser evidence
        if: failure() && steps.browser-e2e.outcome == 'failure' && steps.prepare_browser_evidence.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/ci-failure-evidence/**/test-failed-*.png
            output/playwright/ci-failure-evidence/**/video.webm
            output/playwright/ci-failure-evidence/**/trace.zip
            output/playwright/ci-failure-evidence/**/error-context.md
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
          include-hidden-files: false
